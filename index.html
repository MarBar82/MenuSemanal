<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useCallback,useRef} = React;

const DAYS_SHORT = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DAYS_KEY   = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const MEALS      = ['desayuno','almuerzo','cena'];
const MEAL_LBL   = {desayuno:'Desayuno',almuerzo:'Almuerzo',cena:'Cena'};
const MEAL_ICO   = {desayuno:'🌅',almuerzo:'🍽️',cena:'🌙'};
const RECIPE_CATS = ['Desayuno','Almuerzo','Cena','Merienda','Postre','Otro'];
const ING_CATS   = ['Verduras y frutas','Carnes y pescados','Lácteos y huevos','Granos, harinas y pastas','Conservas y enlatados','Condimentos y especias','Panificados','Bebidas','Otros'];
const CAT_ICO    = {'Verduras y frutas':'🥦','Carnes y pescados':'🥩','Lácteos y huevos':'🥛','Granos, harinas y pastas':'🌾','Conservas y enlatados':'🥫','Condimentos y especias':'🧂','Panificados':'🍞','Bebidas':'🥤','Otros':'📦'};
const UNITS      = ['g','kg','ml','l','unidades','tazas','cucharadas','cucharaditas','pizcas','dientes','ramas','paquetes','latas','fetas'];
const BADGE_CLS  = {Desayuno:'b-desayuno',Almuerzo:'b-almuerzo',Cena:'b-cena',Merienda:'b-merienda',Postre:'b-postre',Otro:'b-otro'};
const CAT_EMO    = {Desayuno:'🌅',Almuerzo:'☀️',Cena:'🌙',Merienda:'☕',Postre:'🍮',Otro:'🍴'};

const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2);

function getWeekKey(date=new Date()){
  const d=new Date(date); d.setHours(0,0,0,0);
  d.setDate(d.getDate()+3-((d.getDay()+6)%7));
  const y=d.getFullYear(), w1=new Date(y,0,4);
  const w=1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);
  return `${y}-W${String(w).padStart(2,'0')}`;
}
function getWeekStart(key){
  const [ys,ws]=key.split('-W'); const y=+ys,w=+ws;
  const jan4=new Date(y,0,4);
  return new Date(jan4.getTime()+((w-1)*7-((jan4.getDay()+6)%7))*86400000);
}
function getWeekDates(key){
  const s=getWeekStart(key);
  return Array.from({length:7},(_,i)=>{const d=new Date(s);d.setDate(d.getDate()+i);return d;});
}
function addWeeks(key,n){const s=getWeekStart(key);s.setDate(s.getDate()+n*7);return getWeekKey(s);}
function fmtDate(d){return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});}
function isToday(d){const t=new Date();return d.getDate()===t.getDate()&&d.getMonth()===t.getMonth()&&d.getFullYear()===t.getFullYear();}
function fmtQty(n){if(!n)return'0';return Number.isInteger(n)?String(n):parseFloat(n.toFixed(1)).toString();}

// Sincroniza con Firestore en tiempo real + caché local
function useFirestoreSync(docId, defaultValue) {
  const [v, setV] = useState(() => {
    try { const s=localStorage.getItem(docId); return s?JSON.parse(s):defaultValue; } catch { return defaultValue; }
  });
  const timerRef = useRef(null);
  const latestRef = useRef(v);

  useEffect(() => {
    const ref = db.collection('app').doc(docId);
    const unsub = ref.onSnapshot(snap => {
      const stored = snap.exists ? snap.data().v : undefined;
      // Considerar vacío: undefined, null, o array vacío cuando el default no lo es
      const esVacio = stored === undefined || stored === null ||
        (Array.isArray(stored) && stored.length === 0 &&
         Array.isArray(defaultValue) && defaultValue.length > 0);
      if (!esVacio) {
        latestRef.current = stored;
        setV(stored);
        try { localStorage.setItem(docId, JSON.stringify(stored)); } catch {}
      } else {
        // Firestore vacío o inexistente → escribir valor actual (default)
        ref.set({ v: latestRef.current }).catch(() => {});
      }
    }, err => console.warn('Firestore:', docId, err.message));
    return () => unsub();
  }, [docId]);

  const set = useCallback((newValOrFn) => {
    setV(prev => {
      const next = typeof newValOrFn === 'function' ? newValOrFn(prev) : newValOrFn;
      latestRef.current = next;
      try { localStorage.setItem(docId, JSON.stringify(next)); } catch {}
      clearTimeout(timerRef.current);
      timerRef.current = setTimeout(() => {
        db.collection('app').doc(docId).set({ v: next }).catch(() => {});
      }, 400);
      return next;
    });
  }, [docId]);

  return [v, set];
}

// ── RECETA MODAL ─────────────────────────────────────────────────────────────
const mkReceta=()=>({id:uid(),nombre:'',categoria:'Almuerzo',porcionesBase:4,ingredientes:[]});
const mkIng=()=>({id:uid(),nombre:'',cantidad:'',unidad:'g',categoria:'Otros'});

function RecetaModal({receta,onSave,onClose}){
  const [f,setF]=useState(()=>receta?{...receta,ingredientes:receta.ingredientes.map(i=>({...i}))}:mkReceta());
  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const addI=()=>setF(p=>({...p,ingredientes:[...p.ingredientes,mkIng()]}));
  const delI=id=>setF(p=>({...p,ingredientes:p.ingredientes.filter(i=>i.id!==id)}));
  const setI=(id,k,v)=>setF(p=>({...p,ingredientes:p.ingredientes.map(i=>i.id===id?{...i,[k]:v}:i)}));

  const save=()=>{
    if(!f.nombre.trim()){alert('Ingresá el nombre de la receta');return;}
    onSave({...f,nombre:f.nombre.trim(),porcionesBase:Math.max(1,parseInt(f.porcionesBase)||1),
      ingredientes:f.ingredientes.filter(i=>i.nombre.trim()).map(i=>({...i,nombre:i.nombre.trim(),cantidad:parseFloat(i.cantidad)||0}))});
  };

  return(
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal modal-lg">
        <div className="modal-header">
          <span className="modal-title">{receta?'Editar receta':'Nueva receta'}</span>
          <button className="btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-group">
            <label className="form-label">Nombre de la receta</label>
            <input className="form-input" value={f.nombre} onChange={e=>set('nombre',e.target.value)} placeholder="Ej: Milanesas con papas" autoFocus/>
          </div>
          <div className="form-row-2">
            <div className="form-group">
              <label className="form-label">Categoría</label>
              <select className="form-select" value={f.categoria} onChange={e=>set('categoria',e.target.value)}>
                {RECIPE_CATS.map(c=><option key={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Porciones base</label>
              <input className="form-input" type="number" min="1" value={f.porcionesBase} onChange={e=>set('porcionesBase',e.target.value)}/>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Ingredientes</label>
            {f.ingredientes.length>0&&(
              <div className="ing-header">
                <span>Ingrediente</span><span>Cantidad</span><span>Unidad</span><span>Categoría de compra</span><span></span>
              </div>
            )}
            {f.ingredientes.map(i=>(
              <div key={i.id} className="ing-row">
                <input className="form-input" placeholder="Nombre" value={i.nombre} onChange={e=>setI(i.id,'nombre',e.target.value)}/>
                <input className="form-input" type="number" min="0" step="0.1" placeholder="0" value={i.cantidad} onChange={e=>setI(i.id,'cantidad',e.target.value)}/>
                <select className="form-select" value={i.unidad} onChange={e=>setI(i.id,'unidad',e.target.value)}>
                  {UNITS.map(u=><option key={u}>{u}</option>)}
                </select>
                <select className="form-select" value={i.categoria} onChange={e=>setI(i.id,'categoria',e.target.value)}>
                  {ING_CATS.map(c=><option key={c}>{c}</option>)}
                </select>
                <button className="btn btn-danger btn-sm" onClick={()=>delI(i.id)} style={{padding:'5px 8px'}}>✕</button>
              </div>
            ))}
            <button className="btn btn-secondary btn-sm" onClick={addI} style={{marginTop:6}}>+ Agregar ingrediente</button>
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={save}>Guardar receta</button>
        </div>
      </div>
    </div>
  );
}

// ── RECETAS TAB ──────────────────────────────────────────────────────────────
function RecetasTab({recetas,setRecetas}){
  const [search,setSearch]=useState('');
  const [modal,setModal]=useState(null);

  const filtered=useMemo(()=>{
    const q=search.toLowerCase();
    return recetas.filter(r=>r.nombre.toLowerCase().includes(q)||r.categoria.toLowerCase().includes(q));
  },[recetas,search]);

  const save=r=>{
    setRecetas(prev=>{const idx=prev.findIndex(x=>x.id===r.id);if(idx>=0){const n=[...prev];n[idx]=r;return n;}return[...prev,r];});
    setModal(null);
  };
  const del=id=>{if(!confirm('¿Eliminar esta receta?'))return;setRecetas(p=>p.filter(r=>r.id!==id));};

  return(
    <div>
      <div className="search-bar">
        <input className="search-input" placeholder="Buscar recetas..." value={search} onChange={e=>setSearch(e.target.value)}/>
        <button className="btn btn-primary" onClick={()=>setModal('add')}>+ Nueva receta</button>
      </div>
      {filtered.length===0?(
        <div className="empty-state">

// ── RECIPE PICKER MODAL ──────────────────────────────────────────────────────
function PickerModal({recetas,slot,onSelect,onRemove,onClose}){
  const [search,setSearch]=useState('');
  const list=recetas.filter(r=>!search||r.nombre.toLowerCase().includes(search.toLowerCase())||r.categoria.toLowerCase().includes(search.toLowerCase()));

    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal">
        <div className="modal-header">
          <span className="modal-title">{MEAL_ICO[slot.meal]} {MEAL_LBL[slot.meal]} — {DAYS_SHORT[slot.dayIdx]}</span>
          <button className="btn-ghost" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <input className="search-input" style={{width:'100%',marginBottom:12}} placeholder="Buscar receta..." value={search} onChange={e=>setSearch(e.target.value)} autoFocus/>

            <div style={{textAlign:'center',padding:'36px 0',color:'#a0aec0'}}>No se encontraron recetas</div>

            <div className="picker-grid">

              ))}

        <div className="modal-footer">
          {slot.currentId&&<button className="btn btn-danger" onClick={()=>{onRemove();onClose();}}>Quitar receta</button>}

// ── LISTA DE COMPRAS ─────────────────────────────────────────────────────────
function calcList(plan,recetas,weekKey,personas){
  const wp=plan[weekKey]||{};
  const totals={};
  for(const day of DAYS_KEY){
    for(const meal of MEALS){
      const slot=wp[day]?.[meal];
      if(!slot)continue;
      const rec=recetas.find(r=>r.id===slot.recipeId);
      if(!rec)continue;
      const mult=(slot.porciones||personas)/(rec.porcionesBase||1);
      for(const ing of rec.ingredientes){
        const k=`${ing.nombre.toLowerCase()}||${ing.unidad}`;
        if(!totals[k])totals[k]={nombre:ing.nombre,unidad:ing.unidad,cat:ing.categoria,qty:0};
        totals[k].qty+=ing.cantidad*mult;
      }
    }
  }
  const groups={};
  for(const item of Object.values(totals)){
    if(!groups[item.cat])groups[item.cat]=[];
    groups[item.cat].push(item);
  }
  for(const c in groups)groups[c].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  return groups;
}

function ListaComprasTab({recetas,plan,personas,currentWeek,setCurrentWeek,shopChecked,setShopChecked}){
  const groups=useMemo(()=>calcList(plan,recetas,currentWeek,personas),[plan,recetas,currentWeek,personas]);
  const dates=getWeekDates(currentWeek);
  const checked=shopChecked[currentWeek]||{};
  const toggle=k=>setShopChecked(p=>({...p,[currentWeek]:{...(p[currentWeek]||{}),[k]:!(p[currentWeek]||{})[k]}}));
  const clearAll=()=>setShopChecked(p=>({...p,[currentWeek]:{}}));
  const hasItems=Object.keys(groups).length>0;

  const copyList=()=>{
    let t=`Lista de compras — ${fmtDate(dates[0])} al ${fmtDate(dates[6])}\n\n`;
    for(const cat of ING_CATS){
      if(!groups[cat])continue;
      t+=`${CAT_ICO[cat]} ${cat}\n`;
      for(const i of groups[cat])t+=`  - ${i.nombre}: ${fmtQty(i.qty)} ${i.unidad}\n`;
      t+='\n';
    }
    navigator.clipboard.writeText(t).then(()=>alert('Lista copiada ✓')).catch(()=>alert('No se pudo copiar'));
  };

  return(
    <div>
      <div className="shop-header">
        <div>
          <div style={{fontWeight:800,fontSize:20,color:'#2d3748'}}>Lista de compras</div>
          <div className="shop-week-info">Semana {currentWeek.split('-W')[1]} · {fmtDate(dates[0])} al {fmtDate(dates[6])} · 👥 {personas} personas</div>
        </div>
        <div className="shop-actions no-print">
          <button className="btn btn-secondary btn-sm" onClick={()=>setCurrentWeek(addWeeks(currentWeek,-1))}>← Anterior</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCurrentWeek(getWeekKey())}>Esta semana</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setCurrentWeek(addWeeks(currentWeek,1))}>Siguiente →</button>
          {hasItems&&<>
            <button className="btn btn-secondary btn-sm" onClick={clearAll}>Desmarcar todo</button>
            <button className="btn btn-secondary btn-sm" onClick={copyList}>📋 Copiar</button>
            <button className="btn btn-secondary btn-sm" onClick={()=>window.print()}>🖨️ Imprimir</button>
          </>}
        </div>
      </div>

      {!hasItems?(
        <div style={{textAlign:'center',padding:'60px 20px',color:'#a0aec0'}}>
          <div style={{fontSize:60,marginBottom:16}}>🛒</div>
          <h3 style={{fontSize:19,fontWeight:700,color:'#718096',marginBottom:8}}>No hay comidas planificadas esta semana</h3>
          <p>Armá el menú en el <strong>Planificador</strong> y la lista se genera sola.</p>
        </div>
      ):(
        ING_CATS.filter(c=>groups[c]).map(cat=>{
          const items=groups[cat];
          const allDone=items.every(i=>checked[`${i.nombre}||${i.unidad}`]);
          return(
            <div key={cat} className="cat-group">
              <div className="cat-group-hdr">
                <span style={{fontSize:18}}>{CAT_ICO[cat]}</span>
                <span className="cat-title">{cat}</span>
                <span className="cat-count">{items.length} ítem{items.length!==1?'s':''}</span>
                {allDone&&<span style={{fontSize:12,color:'#27ae60',fontWeight:700}}>✓ Completo</span>}
              </div>
              {items.map(item=>{
                const k=`${item.nombre}||${item.unidad}`;
                return(
                  <div key={k} className={`shop-item ${checked[k]?'done':''}`} onClick={()=>toggle(k)}>
                    <input type="checkbox" className="shop-cb" checked={!!checked[k]} onChange={()=>toggle(k)} onClick={e=>e.stopPropagation()}/>
                    <span className="shop-name">{item.nombre}</span>
                    <span><span className="shop-qty">{fmtQty(item.qty)}</span><span className="shop-unit">{item.unidad}</span></span>
                  </div>
                );
              })}
            </div>
          );
        })
      )}
    </div>
  );
}

  const [personas,setPersonas]=useFirestoreSync('ms-personas',5);
  const [shopChecked,setShopChecked]=useFirestoreSync('ms-shop-checked',{});
  const [week,setWeek]=useState(()=>getWeekKey());
  const [tab,setTab]=useState('planificador');

  const tabs=[['planificador','📅 Planificador'],['recetas','📖 Recetas'],['compras','🛒 Compras']];

  return(
    <div>
      <header className="app-header">
        <div className="app-logo">Menú<span>Semanal</span></div>
        <nav className="nav-tabs">
          {tabs.map(([k,l])=>(
            <button key={k} className={`nav-tab ${tab===k?'active':''}`} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </nav>
        <div className="personas-ctrl">
          <span>👥</span>
          <input type="number" min="1" max="30" value={personas} onChange={e=>setPersonas(Math.max(1,parseInt(e.target.value)||1))} title="Personas en el hogar"/>
          <span>personas</span>
        </div>
      </header>
      <main className="tab-content">
        {tab==='recetas'&&<RecetasTab recetas={recetas} setRecetas={setRecetas}/>}
        {tab==='planificador'&&<PlanificadorTab recetas={recetas} plan={plan} setPlan={setPlan} personas={personas} currentWeek={week} setCurrentWeek={setWeek}/>}
        {tab==='compras'&&<ListaComprasTab recetas={recetas} plan={plan} personas={personas} currentWeek={week} setCurrentWeek={setWeek} shopChecked={shopChecked} setShopChecked={setShopChecked}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
